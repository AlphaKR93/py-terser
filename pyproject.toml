[project]
name = "py-terser"
version = "0.1.0"
authors = [
    { name = "Alpha", email = "dev@alpha93.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.14.2",
    "hatchling>=1.17",
]

[dependency-groups]
trio = [
    "trio>=0.33.0",
]
cli = [
    "pydantic>=2.13.4",
    "tqdm>=4.68.4",
]
hatchling = [
    "hatchling>=1.31.0",
]
dev = [
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[project.scripts]
terser = "terser.cli:main"

[project.entry-points.hatch]
terser = "terser.hooks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terser", "src/alpha93", "src/terser_hints"]

[tool.ruff]
src = ["src"]
show-fixes = true

unsafe-fixes = true

[tool.ruff.analyze]
detect-string-imports = true

preview = true

[tool.ruff.lint]
future-annotations = true
ignore = [
    "E731",
]

[tool.ty.src]
root = "./src"
