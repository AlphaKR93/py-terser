[project]
name = "py-terser"
version = "0.1.0"
description = "Transform Python modules into its most compact representation"
readme = "README.md"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
terser = "terser.cli:main"

[project.optional-dependencies]
progress = ["tqdm>=4.66.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/terser"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
