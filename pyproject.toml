[project]
name = "py-terser"
version = "0.1.0"
description = "Transform Python projects into its most compact representation"
readme = "README.md"
authors = [{ name = "Alpha", email = "dev@alpha93.kr" }]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[project.optional-dependencies]
cli = [
    "tqdm>=4.68.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
terser = "terser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terser"]

[tool.ruff.lint]
ignore = [
    "E731", # pycodestyle: lambda-assignment
]
