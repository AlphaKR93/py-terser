[project]
name = "py-terser"
version = "0.1.0"
authors = [
    { name = "Alpha", email = "dev@alpha93.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.14.2",
]

[dependency-groups]
cli = [
    "pydantic>=2.13.4",
    "tqdm>=4.68.4",
]

[project.scripts]
terser = "python_minifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terser", "src/python_minifier", "src/alpha93"]
